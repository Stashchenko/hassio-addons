configuration:
  streams:
    name: Streams
    description: The streams that can be selected as input. See https://github.com/badaix/snapcast/blob/master/doc/configuration.md on how to format them.
  buffer:
    name: Buffer
  codec:
    name: Codec
    description: Codec to use for streaming to snapcast clients.
  send_to_muted:
    name: Send to muted clients
  sampleformat:
    name: Sample format
  log_level:
    name: Log level
  extra_clients:
    name: Extra local clients
    description: >-
      Run additional local snapcast clients, each pinned to a specific PulseAudio sink. Use name for a label (used to
      build the client's hostID) and sink for the PulseAudio sink name (e.g. bluez_sink.XX_XX_XX_XX_XX_XX.a2dp_sink,
      as shown by pactl list sinks short). Leaving sink empty uses the default sink.
  eq_web_port:
    name: Equalizer web tuner port
    description: >-
      Port for the equalizer web interface (default 1706)    
